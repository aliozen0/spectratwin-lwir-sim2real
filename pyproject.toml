[project]
name = "spectratwin"
version = "0.1.0"
description = "Physically-motivated RGB-LWIR synthetic data for sim-to-real object detection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.scripts]
spectratwin = "spectratwin.cli:main"

[project.optional-dependencies]
train = [
    "mlflow==3.9.0",
    "torch==2.9.1",
    "torchmetrics[detection]>=1.9.0",
    "torchvision==0.24.1",
    "transformers==5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectratwin"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
